name: Refresh data

# Pulls the latest upstream snapshots into data/ and commits the diff.
# This is what keeps the archive "living" with zero hosted infrastructure.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch upstream data
        run: node scripts/fetch-data.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/ assets/people/)" ]; then
            git config user.name "memorial-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/ assets/people/
            git commit -m "data: refresh $(date -u +%F)"
            git push
          else
            echo "No data changes."
          fi
