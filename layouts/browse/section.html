{{ define "main" }}
  <h1>{{ .Title }}</h1>
  <div class="prose">{{ .Content }}</div>

  {{ range $name, $terms := site.Taxonomies }}
    <section class="browse-group">
      <h2>{{ i18n (printf "facet.%s" $name) }}</h2>
      <ul class="term-list">
        {{ range $terms.ByCount }}
          <li>
            <a href="{{ .Page.RelPermalink }}">
              <span>{{ partial "term-label.html" .Page }}</span>
              <span class="count">{{ .Count }}</span>
            </a>
          </li>
        {{ end }}
      </ul>
    </section>
  {{ end }}
{{ end }}
