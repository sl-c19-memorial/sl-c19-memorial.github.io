{{- $title := .Title | default site.Title -}}
{{- if and .Title (ne .Title site.Title) -}}
  {{- $title = printf "%s — %s" .Title site.Title -}}
{{- end -}}
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ $title }}</title>
<meta name="description" content="{{ site.Params.description }}" />

<meta property="og:type" content="website" />
<meta property="og:title" content="{{ $title }}" />
<meta property="og:description" content="{{ site.Params.description }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:image" content="{{ site.Params.ogImage | absURL }}" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="{{ "favicon.ico" | relURL }}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500&family=Noto+Sans+Tamil:wght@400;500&family=Noto+Sans:wght@400;700&display=swap"
  rel="stylesheet"
/>

{{- $css := resources.Get "css/main.css" | minify | fingerprint -}}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}" />

{{- with .OutputFormats.Get "rss" -}}
  <link rel="{{ .Rel }}" type="{{ .MediaType.Type }}" href="{{ .Permalink }}" title="{{ $title }}" />
{{- end -}}
